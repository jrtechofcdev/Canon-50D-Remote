name: release

# Publishes the APK on the Releases page whenever main carries a versionName that has no release yet
# (or when a v* tag is pushed, or on demand from the Actions tab). The v<versionName> tag is created here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 21

      # The default package list includes the retired "tools" package, so name the ones the build needs.
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.publish == 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.publish == 'true'

      - name: Unit tests
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Name the APK and extract release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "JR_C50D_Sync-v${VERSION}.apk"
          # Section of CHANGELOG.md between "## [VERSION]" and the next "## [".
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[[0-9.]+\]:/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\nInstale o APK no celular e permita "instalar apps desconhecidos". Atualiza por cima da versão anterior.\n' >> notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JR C50D Sync v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: JR_C50D_Sync-v*.apk
